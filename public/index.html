<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Travlr Getaways</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="/">Travlr <span>Getaways</span></a>
            <nav aria-label="Main navigation">
                <a href="/" aria-current="page">Home</a>
                <a href="/travel">Travel</a>
                <a href="/rooms.html">Rooms</a>
                <a href="/meals.html">Meals</a>
                <a href="/news.html">News</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
            </nav>
        </div>
    </header>
    <main class="shell">
        <section class="home-hero" aria-labelledby="home-title">
            <img src="/images/sea-sound.jpg" alt="" fetchpriority="high">
            <div class="hero-copy">
                <h1 id="home-title">Enjoy the summer with us</h1>
                <a class="button" href="/travel">Explore trips</a>
            </div>
        </section>
        <section class="home-section" aria-labelledby="stay-title">
            <h2 id="stay-title">Plan your stay</h2>
            <div class="tiles">
                <a class="tile" href="/rooms.html"><img src="/images/first-class.jpg" alt="" loading="lazy"><span>Rooms</span></a>
                <a class="tile" href="/travel"><img src="/images/reef1.jpg" alt="" loading="lazy"><span>Travel</span></a>
                <a class="tile" href="/meals.html"><img src="/images/seafoods.jpg" alt="" loading="lazy"><span>Meals</span></a>
            </div>
        </section>
        <section class="home-section news-callout">
            <h2>From the resort</h2>
            <a href="/news.html">Experience kayaking</a>
        </section>
    </main>
    <footer class="site-footer">
        <div class="shell footer-inner">
            <a class="brand" href="/">Travlr <span>Getaways</span></a>
            <a href="/contact.html">Contact</a>
        </div>
    </footer>
</body>
</html>
