<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rooms | Travlr Getaways</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="shell header-inner">
            <a class="brand" href="/">Travlr <span>Getaways</span></a>
            <nav aria-label="Main navigation">
                <a href="/">Home</a>
                <a href="/travel">Travel</a>
                <a href="/rooms.html" aria-current="page">Rooms</a>
                <a href="/meals.html">Meals</a>
                <a href="/news.html">News</a>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
            </nav>
        </div>
    </header>
    <main class="shell">
        <header class="travel-heading"><h1>Rooms</h1></header>
        <div class="tiles">
            <article class="tile">
                <img src="/images/first-class.jpg" alt="First Class Room">
                <div class="tile-copy"><h2>First Class Room</h2><p class="rate">220 per day</p></div>
            </article>
            <article class="tile">
                <img src="/images/deluxe.jpg" alt="Deluxe Room">
                <div class="tile-copy"><h2>Deluxe Room</h2><p class="rate">150 per day</p></div>
            </article>
            <article class="tile">
                <img src="/images/suite.jpg" alt="Suite Room">
                <div class="tile-copy"><h2>Suite Room</h2><p class="rate">180 per day</p></div>
            </article>
        </div>
    </main>
    <footer class="site-footer">
        <div class="shell footer-inner">
            <a class="brand" href="/">Travlr <span>Getaways</span></a>
            <a href="/contact.html">Contact</a>
        </div>
    </footer>
</body>
</html>
